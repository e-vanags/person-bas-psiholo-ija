<script>
(function(){
  "use strict";
  // Pantu piederība indeksiem oriģinālajā secībā (anketas atslēga). Nemainīt.
  var KEYS = ["pa","a","v","ua","v","pa","a","pa","ua","ua","a","v"];
  var ITEMS = TEKSTI.panti.map(function(p,i){ return {l:p[0], r:p[1], s:KEYS[i]}; });
  var AREAS = TEKSTI.apgabali.map(function(x){ return {n:x[0], w:x[1]}; });
  var KEY = "scas-merijumi-v1";
  var answers = new Array(12).fill(null);
  var data = load();

  function load(){
    try{ var raw = localStorage.getItem(KEY); var d = raw ? JSON.parse(raw) : []; return Array.isArray(d) ? d : []; }
    catch(e){ return []; }
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){}
  }
  function fill(t, o){ return String(t).replace(/\{(\w+)\}/g, function(m,k){ return (o && k in o) ? o[k] : m; }); }
  // tekstu ielikšana lapā
  document.title = TEKSTI.lapas_nosaukums;
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function(e){ e.innerHTML = TEKSTI[e.getAttribute("data-t")]; });
  TEKSTI.tabula_kolonnas.forEach(function(c){ var th=document.createElement("th"); th.innerHTML=c; document.getElementById("thead").appendChild(th); });
  TEKSTI.lasit_rindkopas.forEach(function(c){ var p=document.createElement("p"); p.innerHTML=c; document.getElementById("lasit").appendChild(p); });
  TEKSTI.avoti.forEach(function(c){ var p=document.createElement("p"); p.innerHTML=c; document.getElementById("avoti").appendChild(p); });

  function fmt(x){ return x.toFixed(1).replace(".", ","); }
  function pad(n){ return (n<10?"0":"")+n; }

  // Jautājumu zīmēšana
  var list = document.getElementById("items");
  ITEMS.forEach(function(it, i){
    var li = document.createElement("li"); li.className = "item";
    var q = document.createElement("p"); q.className = "q";
    q.textContent = (i+1) + ". " + fill(TEKSTI.jautajums, {l:it.l, r:it.r});
    var row = document.createElement("div"); row.className = "row";
    var al = document.createElement("span"); al.className = "anchor l"; al.textContent = it.l;
    var ar = document.createElement("span"); ar.className = "anchor r"; ar.textContent = it.r;
    var sc = document.createElement("div"); sc.className = "scale"; sc.setAttribute("role","group");
    sc.setAttribute("aria-label", q.textContent);
    for(var k=0;k<=8;k++){
      var b = document.createElement("button"); b.type = "button"; b.textContent = k;
      b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label", k + " no 8");
      b.addEventListener("click", (function(idx,val,group){ return function(){
        answers[idx] = val;
        Array.prototype.forEach.call(group.children, function(x){ x.setAttribute("aria-pressed", String(+x.textContent===val)); });
        updateProgress();
      };})(i,k,sc));
      sc.appendChild(b);
    }
    row.appendChild(al); row.appendChild(sc); row.appendChild(ar);
    li.appendChild(q); li.appendChild(row); list.appendChild(li);
  });

  var submitBtn = document.getElementById("submitBtn");
  function updateProgress(){
    var n = answers.filter(function(a){return a!==null;}).length;
    document.getElementById("progress").textContent = fill(TEKSTI.progress, {n:n});
    submitBtn.disabled = n < 12;
  }
  function resetForm(){
    answers = new Array(12).fill(null);
    Array.prototype.forEach.call(document.querySelectorAll(".scale button"), function(b){ b.setAttribute("aria-pressed","false"); });
    updateProgress();
  }
  function score(a){
    var sum = {v:0,a:0,pa:0,ua:0};
    ITEMS.forEach(function(it,i){ sum[it.s] += a[i]; });
    return {v:sum.v/3, a:sum.a/3, pa:sum.pa/3, ua:sum.ua/3};
  }

  submitBtn.addEventListener("click", function(){
    if(answers.some(function(a){return a===null;})) return;
    data.push({t:new Date().toISOString(), ans:answers.slice(), idx:score(answers)});
    save();
    try{ if(window.goatcounter && window.goatcounter.count){ window.goatcounter.count({path:"kodola-afekts-pabeigts", title:"SCAS mērījums saglabāts", event:true}); } }catch(e){}
    resetForm(); showResults(true);
  });
  document.getElementById("againBtn").addEventListener("click", function(){ showForm(); });
  document.getElementById("cancelBtn").addEventListener("click", function(){ showResults(false); });
  document.getElementById("undoBtn").addEventListener("click", function(){
    if(!data.length) return;
    if(!confirm(TEKSTI.apstiprinat_dzest_pedejo)) return;
    data.pop(); save(); data.length ? showResults(false) : showForm();
  });
  document.getElementById("clearBtn").addEventListener("click", function(){
    if(!confirm(TEKSTI.apstiprinat_dzest_visus)) return;
    data = []; save(); showForm();
  });

  function showForm(){
    document.getElementById("resultSection").hidden = true;
    document.getElementById("formSection").hidden = false;
    document.getElementById("cancelBtn").hidden = !data.length;
    window.scrollTo(0,0);
  }
  function showResults(fresh){
    document.getElementById("formSection").hidden = true;
    document.getElementById("resultSection").hidden = false;
    var n = data.length;
    document.getElementById("resLead").innerHTML = n === 1
      ? TEKSTI.ievads_viens_merijums
      : fill(TEKSTI.ievads_vairaki_merijumi, {n:n});
    draw(fresh); table();
    window.scrollTo(0,0);
  }

  function table(){
    var tb = document.getElementById("tbody"); tb.innerHTML = "";
    data.forEach(function(m,i){
      var d = new Date(m.t); var tr = document.createElement("tr");
      if(i===data.length-1) tr.className = "latest";
      var cells = [i+1, pad(d.getHours())+":"+pad(d.getMinutes()), fmt(m.idx.v), fmt(m.idx.a), fmt(m.idx.pa), fmt(m.idx.ua)];
      cells.forEach(function(c){ var td = document.createElement("td"); td.textContent = c; tr.appendChild(td); });
      tb.appendChild(tr);
    });
  }

  // Afekta aplis
  var CX=400, CY=345, U=50, R=4*U, S2=Math.SQRT1_2;
  function P1(m){ return [CX+(m.idx.v-4)*U, CY-(m.idx.a-4)*U]; }
  function P2(m){ var p=m.idx.pa-4, q=m.idx.ua-4; return [CX+(p+q)*S2*U, CY-(p-q)*S2*U]; }
  function el(tag, attrs, parent){
    var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for(var k in attrs) e.setAttribute(k, attrs[k]);
    if(parent) parent.appendChild(e); return e;
  }
  function txt(parent, x, y, s, opt){
    opt = opt || {};
    var t = el("text", {x:x, y:y, "font-size":opt.size||15, fill:opt.fill||"#000", "text-anchor":opt.anchor||"middle",
      "font-weight":opt.weight||"400", "dominant-baseline":"middle"}, parent);
    t.textContent = s; return t;
  }
  function colorFor(i,n){
    if(i===n-1) return "#183B6B";
    var greys = ["#B9BDC6","#8E939E","#5F646E"];
    var k = n-1-i; return greys[Math.max(0, 3-k)] || "#B9BDC6";
  }

  function draw(fresh){
    var box = document.getElementById("figure"); box.innerHTML = "";
    var svg = el("svg", {viewBox:"0 0 800 690", role:"img", "aria-label":"Afekta aplis ar Taviem mērījumiem"});
    var base = el("g", {}, svg);
    el("circle", {cx:CX, cy:CY, r:R, fill:"none", stroke:"#000", "stroke-width":1.5}, base);
    // asis
    var L = R+14, D = (R+14)*S2;
    [[CX-L,CY,CX+L,CY],[CX,CY-L,CX,CY+L],[CX-D,CY+D,CX+D,CY-D],[CX-D,CY-D,CX+D,CY+D]].forEach(function(a,i){
      el("line", {x1:a[0],y1:a[1],x2:a[2],y2:a[3], stroke: i<2 ? "#000" : "#5F646E", "stroke-width": i<2?1.2:1}, base);
    });
    // iedaļas
    for(var k=0;k<=8;k++){
      var o=(k-4)*U, t=5;
      if(k!==4){
        el("line",{x1:CX+o,y1:CY-t,x2:CX+o,y2:CY+t,stroke:"#000"},base);
        el("line",{x1:CX-t,y1:CY-o,x2:CX+t,y2:CY-o,stroke:"#000"},base);
        if(k>0 && k<8){
          txt(base, CX+o, CY+16, k, {size:12, fill:"#4A4D55"});
          txt(base, CX-14, CY-o, k, {size:12, fill:"#4A4D55", anchor:"end"});
        }
        // diagonāle PA/UD: 0 apakšā pa kreisi, 8 augšā pa labi
        var dx=CX+o*S2, dy=CY-o*S2;
        el("line",{x1:dx-t*S2,y1:dy-t*S2,x2:dx+t*S2,y2:dy+t*S2,stroke:"#5F646E"},base);
        if(k>0 && k<8) txt(base, dx+10, dy+10, k, {size:11, fill:"#8E939E"});
        // diagonāle UA/PD: 0 augšā pa kreisi, 8 apakšā pa labi
        var ex=CX+o*S2, ey=CY+o*S2;
        el("line",{x1:ex-t*S2,y1:ey+t*S2,x2:ex+t*S2,y2:ey-t*S2,stroke:"#5F646E"},base);
        if(k>0 && k<8) txt(base, ex+10, ey-10, k, {size:11, fill:"#8E939E"});
      }
    }
    // asu nosaukumi ar aptaujas vārdiem
    var G = {size:13, fill:"#5F646E"};
    var T = TEKSTI.aplis;
    txt(base, CX, CY-R-44, T.augsa, {size:17, weight:700});
    txt(base, CX, CY-R-26, T.augsa_vardi, G);
    txt(base, CX, CY+R+26, T.apaksa_vardi, G);
    txt(base, CX, CY+R+44, T.apaksa, {size:17, weight:700});
    txt(base, CX+R+22, CY-20, T.pa_labi[0], {size:17, weight:700, anchor:"start"});
    txt(base, CX+R+22, CY, T.pa_labi[1], {size:17, weight:700, anchor:"start"});
    txt(base, CX+R+22, CY+20, T.pa_labi_vardi, Object.assign({anchor:"start"},G));
    txt(base, CX-R-22, CY-20, T.pa_kreisi[0], {size:17, weight:700, anchor:"end"});
    txt(base, CX-R-22, CY, T.pa_kreisi[1], {size:17, weight:700, anchor:"end"});
    txt(base, CX-R-22, CY+20, T.pa_kreisi_vardi, Object.assign({anchor:"end"},G));
    var c = (R+28)*S2;
    function corner(sx, sy, a, b, w){
      var x = CX + sx*(c+6), y0 = CY + sy*c + (sy<0 ? -36 : 0), an = sx>0 ? "start" : "end";
      txt(base, x, y0, a, {size:15, weight:700, anchor:an});
      txt(base, x, y0+18, b, {size:15, weight:700, anchor:an});
      txt(base, x, y0+36, w, Object.assign({anchor:an},G));
    }
    corner(1,-1,T.augsa_pa_labi[0],T.augsa_pa_labi[1],T.augsa_pa_labi_vardi);
    corner(-1,-1,T.augsa_pa_kreisi[0],T.augsa_pa_kreisi[1],T.augsa_pa_kreisi_vardi);
    corner(1,1,T.apaksa_pa_labi[0],T.apaksa_pa_labi[1],T.apaksa_pa_labi_vardi);
    corner(-1,1,T.apaksa_pa_kreisi[0],T.apaksa_pa_kreisi[1],T.apaksa_pa_kreisi_vardi);

    // apgabala iezīmējums
    var wedge = el("path", {d:"", fill:"#183B6B", "fill-opacity":0.08, stroke:"none", visibility:"hidden"}, base);
    var tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true; box.appendChild(tip);
    function areaOf(px, py){
      var dx = (px-CX)/U, dy = -(py-CY)/U, r = Math.hypot(dx, dy);
      var ang = (Math.atan2(dy, dx)*180/Math.PI + 360) % 360;
      return {r:r, k: Math.round(ang/45) % 8};
    }
    function wedgePath(k){
      var a0 = (k*45-22.5)*Math.PI/180, a1 = (k*45+22.5)*Math.PI/180;
      return "M"+CX+","+CY+" L"+(CX+R*Math.cos(a0))+","+(CY-R*Math.sin(a0))+
        " A"+R+","+R+" 0 0 0 "+(CX+R*Math.cos(a1))+","+(CY-R*Math.sin(a1))+" Z";
    }
    function showTip(i, evt){
      var m = data[i], c = centres[i], a = areaOf(c[0], c[1]), d = new Date(m.t);
      var html = "<b>" + fill(TEKSTI.lodzins_virsraksts, {n:i+1, laiks:pad(d.getHours()) + ":" + pad(d.getMinutes())}) + "</b>";
      if(a.r < 0.75){
        html += "<div class='area'>" + TEKSTI.lodzins_centrs_nosaukums + "</div><p class='words'>" + TEKSTI.lodzins_centrs_teksts + "</p>";
        wedge.setAttribute("visibility","hidden");
      } else {
        html += "<div class='area'>" + AREAS[a.k].n + (a.r < 2 ? TEKSTI.lodzins_viegli : "") + "</div>" +
          "<p class='words'>" + AREAS[a.k].w + "</p>";
        wedge.setAttribute("d", wedgePath(a.k)); wedge.setAttribute("visibility","visible");
      }
      html += "<div class='hint'>" + TEKSTI.lodzins_piezime + "</div>";
      tip.innerHTML = html; tip.hidden = false;
      var rect = box.getBoundingClientRect(), sv = svg.getBoundingClientRect(), sc = sv.width/800;
      var x = c[0]*sc + (sv.left-rect.left), y = c[1]*sc + (sv.top-rect.top);
      var tw = tip.offsetWidth, th = tip.offsetHeight;
      var left = x + 18; if(left + tw > rect.width) left = x - tw - 18; if(left < 0) left = 4;
      var top = y - th - 14; if(top < 0) top = y + 18;
      tip.style.left = left + "px"; tip.style.top = top + "px";
    }
    function hideTip(){ tip.hidden = true; wedge.setAttribute("visibility","hidden"); }

    // mērījumi
    var n = data.length, layer = el("g", {}, svg);
    var defs = el("defs", {}, svg);
    var centres = data.map(function(m){ var a=P1(m), b=P2(m); return [(a[0]+b[0])/2,(a[1]+b[1])/2]; });
    data.forEach(function(m,i){
      var col = colorFor(i,n), a=P1(m), b=P2(m), cx=centres[i][0], cy=centres[i][1];
      var dist = Math.hypot(b[0]-a[0], b[1]-a[1]), ang = Math.atan2(b[1]-a[1], b[0]-a[0])*180/Math.PI;
      var g = el("g", {class: "meas" + ((fresh && i===n-1) ? " new-ell" : ""), tabindex:0, role:"button",
        "aria-label": (i+1) + ". mērījums, parādīt raksturīgās emocijas"}, layer);
      (function(idx){
        g.addEventListener("pointerenter", function(e){ showTip(idx, e); });
        g.addEventListener("pointerleave", function(e){ if(e.pointerType === "mouse") hideTip(); });
        g.addEventListener("click", function(e){ e.stopPropagation(); showTip(idx, e); });
        g.addEventListener("focus", function(e){ showTip(idx, e); });
        g.addEventListener("blur", hideTip);
      })(i);
      el("ellipse", {cx:cx, cy:cy, rx:dist/2+16, ry:16, transform:"rotate("+ang+" "+cx+" "+cy+")",
        fill:col, "fill-opacity": i===n-1 ? 0.18 : 0.12, stroke:col, "stroke-width": i===n-1 ? 2 : 1.2}, g);
      el("circle", {cx:a[0], cy:a[1], r:6, fill:col}, g);
      el("circle", {cx:b[0], cy:b[1], r:5.5, fill:"#fff", stroke:col, "stroke-width":2.2}, g);
    });
    // bultiņas starp centriem
    for(var i=1;i<n;i++){
      var col = colorFor(i,n), id = "ah"+i;
      var mk = el("marker", {id:id, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:7, markerHeight:7, orient:"auto-start-reverse"}, defs);
      el("path", {d:"M0,0 L10,5 L0,10 z", fill:col}, mk);
      var p = centres[i-1], q = centres[i], len = Math.hypot(q[0]-p[0], q[1]-p[1]);
      if(len < 8) continue;
      var ux=(q[0]-p[0])/len, uy=(q[1]-p[1])/len, s=Math.min(10,len/4);
      el("line", {x1:p[0]+ux*s, y1:p[1]+uy*s, x2:q[0]-ux*s, y2:q[1]-uy*s, stroke:col, "stroke-width":2.2, "marker-end":"url(#"+id+")", "pointer-events":"none"}, layer);
    }
    // numuri
    data.forEach(function(m,i){
      var col = colorFor(i,n), cx = centres[i][0], cy = centres[i][1];
      var g = el("g", {"pointer-events":"none"}, layer);
      el("circle", {cx:cx+20, cy:cy-22, r:11, fill:"#fff", stroke:col, "stroke-width":1.5}, g);
      txt(g, cx+20, cy-21, i+1, {size:13, weight:700, fill: i===n-1 ? "#183B6B" : "#4A4D55"});
    });
    box.appendChild(svg);
    svg.addEventListener("click", hideTip);
  }

  // sākuma stāvoklis
  if(data.length){ showResults(false); } else { showForm(); }
  updateProgress();
})();
</script>
</body>
</html>
